[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emer"
version = "0.1.0"
description = "Source-grounded synthetic practice knowledge workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.15,<2",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "numpy>=2.2,<3",
    "python-multipart>=0.0.20",
    "typer>=0.15,<1",
    "tiktoken>=0.11,<1",
    "onnxruntime>=1.22,<2",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=0.34,<2",
]

[project.scripts]
emer = "emer.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11", "respx>=0.22"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/emer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
